set default=0
set timeout=5

if loadfont /boot/grub/themes/silentium/unicode.pf2; then
  set gfxmode=auto
  insmod gfxterm
  terminal_output gfxterm
fi

menuentry "Silentium Live (linux-zen)" {
  linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% apparmor=1 security=apparmor quiet
  initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
}

menuentry "Silentium Live (failsafe)" {
  linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% apparmor=1 security=apparmor nomodeset
  initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
}
