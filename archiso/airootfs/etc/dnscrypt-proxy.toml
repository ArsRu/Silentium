# Конфигурация dnscrypt-proxy для Silentium.
listen_addresses = ['127.0.0.1:53', '[::1]:53']
max_clients = 250
ipv4_servers = true
ipv6_servers = true
doh_servers = true
dnscrypt_servers = true
require_dnssec = true
require_nolog = true
require_nofilter = true

server_names = ['quad9-doh-ip4-port443-filter-pri', 'mullvad-doh', 'cloudflare']

[query_log]
  file = '/var/log/dnscrypt-proxy/query.log'
  format = 'tsv'

[nx_log]
  file = '/var/log/dnscrypt-proxy/nx.log'
  format = 'tsv'

[sources]
  [sources.'public-resolvers']
    urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md']
    cache_file = '/var/cache/dnscrypt-proxy/public-resolvers.md'
    minisign_key = 'RWQf6LRCGaM9rA2vW3vHCCjPw8ewK6ShNQxH6xHgVn9Y6+6lBzG7fHn0'
    refresh_delay = 72
    prefix = ''

  [sources.'relays']
    urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/relays.md']
    cache_file = '/var/cache/dnscrypt-proxy/relays.md'
    minisign_key = 'RWQf6LRCGaM9rA2vW3vHCCjPw8ewK6ShNQxH6xHgVn9Y6+6lBzG7fHn0'
    refresh_delay = 72
    prefix = ''

[blocked_names]
blocked_names_file = '/etc/dnscrypt-proxy-oidd.txt'
log_file = '/var/log/dnscrypt-proxy/blocked.log'
