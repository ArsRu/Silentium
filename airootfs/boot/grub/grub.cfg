set default="0"
set timeout=5

menuentry "Silentium Linux (Live)" {
    echo "Loading kernel..."
    linux /silentium/boot/x86_64/vmlinuz-linux-zen archisobasedir=silentium archisolabel=SILENTIUM_ROOT quiet splash
    echo "Loading initrd..."
    initrd /silentium/boot/x86_64/initramfs-linux-zen.img
}
